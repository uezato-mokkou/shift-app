name: Supabase Keep Alive

on:
  schedule:
    # 毎日実行（UTC 0:00 = JST 9:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://sfjxnwmxzfotaffizmdx.supabase.co/rest/v1/shift_app_data?limit=1" \
            -H "apikey: sb_publishable_bdh-3nYAr937r3aj54P_WA_2zj_pq8u" \
            -H "Authorization: Bearer sb_publishable_bdh-3nYAr937r3aj54P_WA_2zj_pq8u")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Supabase is alive"
          else
            echo "⚠️ Unexpected status: $STATUS"
          fi
